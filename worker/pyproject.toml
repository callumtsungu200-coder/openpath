[project]
name = "openpath-worker"
version = "0.1.0"
description = "OpenPath automated UK opportunity discovery engine"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.75",
  "beautifulsoup4>=4.12",
  "celery[redis]>=5.4",
  "extruct>=0.17",
  "httpx>=0.27",
  "playwright>=1.48",
  "psycopg[binary]>=3.2",
  "python-dateutil>=2.9",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "scrapy>=2.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
openpath = "openpath.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["openpath*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
