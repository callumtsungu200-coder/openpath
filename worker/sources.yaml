# Every source here was checked to respond with real listings on 1 Nov 2026.
# Greenhouse, Lever and Ashby publish these boards as public JSON APIs.
# Add a source, then run: openpath sources sync
#
# Adapters:
#   greenhouse / lever / ashby: config.board is the employer's board token
#   jsonld_crawl: url is a careers listing page; Scrapy follows links and reads
#                 schema.org JobPosting data. Optional config: link_pattern, max_pages
#   rendered:     same as jsonld_crawl, but pages are rendered by Playwright first
#                 (for sites that build their listings with JavaScript)
#
# industry is used when a posting does not imply one more strongly.

# The official source for apprenticeships in England. Stays paused until
# FIND_APPRENTICESHIP_API_KEY is set, then run: openpath sources sync
- slug: find-an-apprenticeship
  name: Find an apprenticeship (GOV.UK)
  adapter: gov_apprenticeships
  url: https://www.findapprenticeship.service.gov.uk
  requires_env: FIND_APPRENTICESHIP_API_KEY
  config: { page_size: 100 }
- slug: monzo
  name: Monzo careers
  adapter: greenhouse
  url: https://monzo.com/careers
  config: { board: monzo }
  company_name: Monzo
  company_url: https://monzo.com
  industry: Finance & Banking
